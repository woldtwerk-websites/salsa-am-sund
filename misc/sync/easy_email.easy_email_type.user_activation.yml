  value: '<p>Hallo [easy_email:recipient_uid:0:entity:display-name],</p><p>dein Account auf [site:name] ist freigeschaltet. Du kannst dich jetzt über diesen Link anmelden und dein Passwort festlegen:</p><p><a class="button" href="[easy_email:recipient_uid:0:entity:one-time-login-url]">Anmelden und Passwort festlegen</a></p><p>Der Link funktioniert nur einmal und führt dich direkt zur Seite, auf der du dein Passwort festlegst.</p><p>Danach kannst du dich auf [site:login-url] jederzeit anmelden mit:</p><p>Benutzername: [easy_email:recipient_uid:0:entity:account-name]<br>Passwort: dein Passwort</p><p>Hast du dich mit Google, GitHub oder Facebook registriert? Dann meldest du dich einfach weiter darüber an.</p><p>Viele Grüße<br>Dein Team von [site:name]</p>'
