# Custom (NOT ddev-generated) config.
#
# Purpose: persist Vite DevTools state across `ddev restart`.
#
# @vitejs/devtools-kit resolves its global storage dir as
# `join(homedir(), ".vite/devtools")` (see getStorageDir() in
# devtools-kit/dist/node/index.js) and writes settings.json (dock/UI prefs,
# command shortcuts) plus auth.json (the trusted-origin list) there. Vite runs
# inside the web container, so that is /home/$USER/.vite/devtools — and the
# container home is rebuilt from the image on every start, taking both files
# with it.
#
# The project root is bind-mounted at /var/www/html, so redirecting that one
# directory into .ddev/.vite-devtools makes the writes land on the host and
# survive restarts. A symlink is used rather than .ddev/homeadditions because
# homeadditions only ever copies *into* the container (and dereferences
# symlinks), so runtime writes would still be lost.
#
# The `rm -rf` only ever touches the ephemeral in-container copy — either a
# stale symlink (removing the link, not its target) or the directory the image
# recreates on each start.
#
# Per-developer state: .ddev/.vite-devtools is gitignored.

hooks:
  post-start:
    - exec: mkdir -p /var/www/html/.ddev/.vite-devtools "$HOME/.vite" && rm -rf "$HOME/.vite/devtools" && ln -sfn /var/www/html/.ddev/.vite-devtools "$HOME/.vite/devtools"
