$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Link-Eintrag
description: 'Einzelner Link für eine Linkliste, mit Beschreibung und Icon für externe Ziele.'
group: 'Salsa am Sund'
status: stable
props:
  type: object
  required:
    - label
    - href
  properties:
    label:
      type: string
      title: Beschriftung
      examples:
        - 'Kursplan als PDF'
    href:
      type: string
      title: Link
      format: uri-reference
      examples:
        - '/kurse'
    description:
      type: string
      title: Beschreibung
      examples:
        - 'Alle Zeiten und Level auf einen Blick.'
