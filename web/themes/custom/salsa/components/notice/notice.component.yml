$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Hinweis
description: 'Hervorgehobener Hinweis mit Icon, z. B. für Termine oder Kursinfos.'
group: 'Salsa am Sund'
status: stable
props:
  type: object
  required:
    - text
    - tone
    - icon
  properties:
    title:
      type: string
      title: Titel
      examples:
        - 'Neu: Schnupperkurs'
    text:
      type: string
      title: Text
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - '<p>Jeden Samstag um 11 Uhr kannst du eine Stunde kostenlos reinschnuppern. Keine Anmeldung nötig.</p>'
    tone:
      type: string
      title: Farbton
      enum:
        - flame
        - sea
        - sand
      meta:enum:
        flame: Flamme
        sea: Sund
        sand: Sand
      default: flame
      examples:
        - flame
    icon:
      type: string
      title: Icon
      enum:
        - none
        - music
        - calendar
        - users
      meta:enum:
        none: Keins
        music: Musik
        calendar: Kalender
        users: Menschen
      default: music
      examples:
        - music
