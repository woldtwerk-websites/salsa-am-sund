$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Raster
description: 'Responsives Raster für Karten und andere Komponenten.'
group: 'Salsa am Sund'
status: stable
props:
  type: object
  required:
    - columns
    - gap
  properties:
    columns:
      type: string
      title: Spalten
      enum:
        - '2'
        - '3'
        - '4'
      meta:enum:
        '2': Zwei Spalten
        '3': Drei Spalten
        '4': Vier Spalten
      default: '3'
      examples:
        - '3'
    gap:
      type: string
      title: Abstand
      enum:
        - md
        - lg
      meta:enum:
        md: Mittel
        lg: Groß
      default: md
      examples:
        - md
slots:
  items:
    title: Elemente
    description: 'Karten oder andere Komponenten im Raster. Auf Mobilgeräten eine Spalte.'
