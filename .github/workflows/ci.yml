name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  drupal:
    uses: woldtwerk-websites/renovate-config/.github/workflows/drupal-ci.yml@main
    with:
      build-script: typecheck
      # Its post-start hook installs agent skills, not needed in CI.
      ddev-skip-configs: config.ai.yaml
      # Without the host or the DB_SNAPSHOT_KEY secret, the reusable workflow
      # installs a fresh site.
      db-ssh-host: ${{ vars.DB_SNAPSHOT_HOST }}
      db-ssh-known-hosts: ${{ vars.DB_SNAPSHOT_KNOWN_HOSTS }}
    secrets:
      db-snapshot-key: ${{ secrets.DB_SNAPSHOT_KEY }}
