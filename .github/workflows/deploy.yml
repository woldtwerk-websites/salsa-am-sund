name: Deploy

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  approve:
    runs-on: ubuntu-latest
    # Requires a manual approval before deploying.
    environment: production
    # A newer push supersedes a deploy that is still waiting for approval.
    concurrency:
      group: deploy-production-approval
      cancel-in-progress: true
    steps:
      - run: echo "Approved"

  deploy:
    needs: approve
    runs-on: ubuntu-latest
    # Not cancel-in-progress: killing Deployer mid-release leaves the deploy lock
    # behind.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: production
          lfs: true
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
      - run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
      # Its postinstall builds theme libraries.
      - uses: voidzero-dev/setup-vp@6a033122543ee100d01838245fe74a26a038da6d # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - uses: deployphp/action@a1b46c204dbde25a32ed0d7bb6751ac3377ca1e9 # v1
        with:
          dep: deploy --file misc/deployer/deploy.yaml production
          private-key: ${{ secrets.PRIVATE_KEY }}
