name: Promote

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main supersedes a running promote: it fast-forwards production
# to a commit that contains the older one. Grouped by ref, so a manual run from
# another branch (which never promotes) cannot cancel the one from main.
concurrency:
  group: promote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # A manual run from another branch must not reach production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      promote: ${{ steps.check.outputs.promote }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Renovate tooling updates reach production with the next runtime change.
      - id: check
        run: bash .github/scripts/promote-check.sh

  ci:
    needs: changes
    if: needs.changes.outputs.promote == 'true'
    uses: ./.github/workflows/ci.yml
    # inherit also passes CONFIG_PUSH_TOKEN; it is inert on push events, where
    # the config check fails instead of pushing (not a Renovate PR).
    secrets: inherit

  promote:
    needs: [changes, ci]
    if: needs.changes.outputs.promote == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # A deploy key, not GITHUB_TOKEN: GITHUB_TOKEN cannot update a ref
          # across commits that change .github/workflows, and its pushes do not
          # trigger deploy.yml. A deploy-key push does.
          ssh-key: ${{ secrets.PROMOTE_DEPLOY_KEY }}
      # No --force: fast-forward only, so it fails instead of clobbering
      # production if the branches diverged.
      - run: git push origin "$GITHUB_SHA:refs/heads/production"
