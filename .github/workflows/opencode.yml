name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

jobs:
  opencode:
    # Labels need triage rights, so only comments check the author.
    if: |
      ((github.event_name == 'issues' || github.event_name == 'pull_request') &&
       github.event.label.name == 'opencode') ||
      ((contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # This only installs DDEV. The agent runs .github/scripts/ci-site-install.sh
      # when its task needs a site (see AGENTS.md).
      - uses: ddev/github-action-setup-ddev@fdf2f5c97943bae638f31df6df86f1defa6210c0 # v1.12.1
        with:
          autostart: false

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Nobody can answer permission prompts in CI; a pending "ask" hangs the
          # job silently (it waited 48 min on reading a screenshot from /tmp).
          OPENCODE_CONFIG_CONTENT: >-
            {"permission": {"external_directory": "allow", "doom_loop": "deny"}}
        with:
          model: ${{ vars.OPENCODE_MODEL }}
          # Issues carry no comment to read instructions from; PRs default to a review.
          prompt: >-
            ${{ github.event_name == 'issues' && format('Implement this issue and open a pull request. Title: {0}. Description: {1}', github.event.issue.title, github.event.issue.body) || '' }}
